<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AH | Fresh Bouquets, Made to Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase Compatibility SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

<style>
  :root{
    --bg:#FAF8FD;
    --bg-alt:#ECE2F7;
    --ink:#2B2140;
    --ink-soft:#7D7291;
    --wine:#6B4FA0;
    --wine-dark:#4E3873;
    --rose:#D6C6EE;
    --sage:#8C9B7E;
    --sage-dark:#6c7a5f;
    --card:#FFFFFF;
    --line: rgba(43,33,64,0.12);
    --shadow: 0 20px 50px -20px rgba(43,33,64,0.35);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .eyebrow{
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--wine); font-weight:600;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
  @media(max-width:600px){.wrap{padding:0 18px;}}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(251,245,238,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:76px;
  }
  .logo{
    font-family:'Fraunces',serif; font-weight:700; font-size:28px;
    letter-spacing:0.01em; display:flex; align-items:center; gap:12px; line-height:1;
  }
  .logo span{
    font-size:11px; font-family:'Inter'; letter-spacing:0.16em; color:var(--ink-soft); font-weight:600;
    text-transform:uppercase; padding-left:12px; border-left:1px solid var(--line); line-height:1.3;
  }
  .nav-links{display:flex; gap:34px; font-size:14px; font-weight:500;}
  .nav-links a{position:relative; padding:4px 0;}
  .nav-links a::after{
    content:''; position:absolute; left:0; bottom:0; height:1px; width:0%;
    background:var(--wine); transition:width .25s ease;
  }
  .nav-links a:hover::after{width:100%;}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 22px; border-radius:999px; font-size:13.5px; font-weight:600;
    border:1px solid transparent; transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .btn-wine{background:var(--wine); color:#fff;}
  .btn-wine:hover{transform:translateY(-2px); box-shadow:0 14px 28px -10px rgba(110,30,54,0.55);}
  .btn-outline{background:transparent; border-color:var(--ink); color:var(--ink);}
  .btn-outline:hover{background:var(--ink); color:#fff;}
  .btn-sm{padding:9px 16px; font-size:12.5px;}
  .menu-toggle{display:none; background:none; border:none; font-size:22px; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px;}
  .menu-toggle:hover{background:var(--bg-alt);}
  @media(max-width:760px){
    .logo span{display:none;}
    .nav-links{
      display:none; position:absolute; top:76px; left:0; right:0; background:var(--bg);
      flex-direction:column; align-items:flex-start; gap:4px; padding:14px 18px 18px; border-bottom:1px solid var(--line);
      box-shadow:var(--shadow);
    }
    .nav-links.open{display:flex;}
    .nav-links a{padding:10px 0; width:100%;}
    .menu-toggle{display:flex;}
  }
  @media(max-width:420px){
    .nav-right .btn-sm{padding:8px 12px; font-size:11px;}
    .logo{font-size:23px;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative; padding:70px 0 50px; overflow:hidden;
    background:radial-gradient(circle at 50% 0%, var(--bg-alt), var(--bg) 60%);
  }
  .hero-inner{max-width:840px; margin:0 auto; text-align:center; position:relative;}
  .hero-inner .eyebrow{display:block; margin-bottom:6px;}
  .hero-headline{position:relative; margin:6px 0 8px;}
  .hero-headline .line{
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(44px, 8.6vw, 100px);
    line-height:0.94; display:block; letter-spacing:-0.01em; position:relative; z-index:1;
  }
  .hero-headline .line.accent{color:var(--wine); font-style:italic; font-weight:600;}
  .hero-bouquet{
    width:clamp(230px, 31vw, 390px); aspect-ratio:2/3; margin:-3.5% auto -7%; position:relative; z-index:2;
    perspective:1000px;
  }
  .hero-illustration{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    transform-style:preserve-3d; transition:transform .15s ease-out;
  }
  .hero-illustration img{
    display:block; width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 18px 26px rgba(43,33,64,0.18));
  }
  @media(max-width:600px){
    .hero{padding-top:52px;}
    .hero-bouquet{width:min(290px, 82vw); margin:-2% auto -9%;}
  }
  .hero p.lead{font-size:17px; color:var(--ink-soft); max-width:480px; line-height:1.65; margin:24px auto 32px; text-align:center;}
  .hero-cta{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .hero-strip-note{
    margin-top:34px; display:inline-flex; align-items:center; gap:10px; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .hero-strip-note .dot{width:7px; height:7px; border-radius:50%; background:var(--sage); flex:none;}

  /* ---------- MARQUEE STRIP ---------- */
  .strip{
    background:var(--wine); color:#fff; padding:12px 0; overflow:hidden; white-space:nowrap;
  }
  .strip-track{display:inline-flex; gap:40px; animation:scrollLeft 26s linear infinite; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600;}
  @keyframes scrollLeft{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  /* ---------- CATEGORY CHIPS ---------- */
  .catalog{padding:80px 0 20px;}
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:18px; margin-bottom:34px;}
  .section-head h2{font-size:clamp(30px,4vw,44px); font-weight:600; margin:8px 0 0;}
  .chips{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:44px;}
  .chip{
    padding:10px 20px; border-radius:999px; border:1px solid var(--line); font-size:13.5px; font-weight:600;
    background:var(--card); transition:all .2s ease;
  }
  .chip.active, .chip:hover{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* ---------- PRODUCT GRID ---------- */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.grid{grid-template-columns:1fr;}}
  .card{
    background:var(--card); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);
    transition:transform .12s ease, box-shadow .12s ease; transform-style:preserve-3d; will-change:transform;
    display:flex; flex-direction:column;
  }
  .card:hover{box-shadow:var(--shadow);}
  .card-media{
    aspect-ratio:4/5; background:linear-gradient(160deg,var(--bg-alt),var(--bg)); position:relative; overflow:hidden;
  }
  .card-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-tag{
    position:absolute; top:14px; left:14px; background:rgba(255,255,255,0.92); padding:6px 12px;
    border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--wine);
  }
  .card-body{padding:20px 20px 22px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .card-body h3{font-size:19px; font-weight:600; margin:0;}
  .price-row{display:flex; align-items:center; justify-content:space-between; margin-top:auto;}
  .price{font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--wine);}
  .order-btn{
    display:inline-flex; align-items:center; gap:7px; background:var(--sage); color:#fff; padding:10px 16px;
    border-radius:999px; font-size:12.5px; font-weight:700; border:none; transition:background .2s ease, transform .2s ease;
  }
  .order-btn:hover{background:var(--sage-dark); transform:translateY(-2px);}
  .empty-state{
    text-align:center; padding:70px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:var(--radius);
  }

  /* ---------- ABOUT ---------- */
  .about{padding:110px 0; background:var(--bg-alt); margin-top:100px; position:relative;}
  .about-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px; align-items:center;}
  @media(max-width:800px){.about-grid{grid-template-columns:1fr;}}
  .about h2{font-size:clamp(32px,5vw,52px); font-weight:600; line-height:1.05; margin:0 0 20px;}
  .about p{color:var(--ink-soft); line-height:1.7; font-size:15.5px; max-width:480px;}
  .stat-row{display:flex; gap:40px; margin-top:34px; flex-wrap:wrap;}
  .stat b{display:block; font-family:'Fraunces',serif; font-size:34px; color:var(--wine);}
  .stat span{font-size:12.5px; color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase;}
  .about-visual{display:flex; align-items:center; justify-content:center;}

  /* ---------- FOOTER ---------- */
  footer{padding:70px 0 30px; background:var(--ink); color:#F3E4DA;}
  .footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:40px; padding-bottom:40px; border-bottom:1px solid rgba(255,255,255,0.12);}
  @media(max-width:700px){.footer-grid{grid-template-columns:1fr;}}
  footer h4{font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 12px;}
  footer p{color:#cbb9b3; font-size:14px; line-height:1.7; max-width:320px;}
  .footer-col h5{font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:#cbb9b3; margin-bottom:14px;}
  .footer-col a{display:block; font-size:14px; margin-bottom:10px; color:#F3E4DA; opacity:.9;}
  .footer-col a:hover{opacity:1; text-decoration:underline;}
  .social-row{display:flex; gap:12px; margin-top:16px;}
  .social-row a{
    width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .bottom-bar{display:flex; justify-content:space-between; align-items:center; padding-top:22px; font-size:12.5px; color:#a6928d; flex-wrap:wrap; gap:10px;}
  .bottom-bar a{opacity:.7; font-size:12px;}
  .bottom-bar a:hover{opacity:1; text-decoration:underline;}

  /* ---------- WHATSAPP FLOAT ---------- */
  .wa-float{
    position:fixed; bottom:26px; right:26px; z-index:60; width:60px; height:60px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center; box-shadow:0 14px 30px -8px rgba(37,211,102,0.6);
    animation:pulse 2.4s ease-in-out infinite; cursor:pointer;
  }
  @keyframes pulse{0%,100%{box-shadow:0 14px 30px -8px rgba(37,211,102,0.6);} 50%{box-shadow:0 14px 40px -4px rgba(37,211,102,0.85);}}

  /* ---------- REVEAL ---------- */
  .reveal{opacity:0; transform:translateY(26px); transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
  @media(prefers-reduced-motion:reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    .strip-track{animation:none;}
    .wa-float{animation:none;}
  }

  /* ---------- ADMIN ---------- */
  .admin-link{background:none; border:none; color:#a6928d; font-size:12px; text-decoration:underline; cursor:pointer;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(42,27,31,0.55); backdrop-filter:blur(4px); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:var(--card); border-radius:20px; max-width:420px; width:100%; padding:32px; box-shadow:var(--shadow);
  }
  .modal h3{margin:0 0 6px; font-size:22px;}
  .modal p.hint{color:var(--ink-soft); font-size:13px; margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); font-family:inherit; font-size:14px; background:#fff;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .modal-actions{display:flex; gap:10px; margin-top:8px;}
  .error-text{color:var(--wine); font-size:12.5px; margin-top:-8px; margin-bottom:12px;}

  .admin-screen{
    position:fixed; inset:0; background:var(--bg); z-index:90; overflow-y:auto;
  }
  .admin-header{
    position:sticky; top:0; background:var(--ink); color:#fff; padding:18px 0; z-index:5;
  }
  .admin-header .wrap{display:flex; align-items:center; justify-content:space-between;}
  .admin-body{padding:40px 0 100px;}
  .admin-tabs{display:flex; gap:10px; margin-bottom:30px;}
  .admin-tab{padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:13.5px; font-weight:600;}
  .admin-tab.active{background:var(--wine); color:#fff; border-color:var(--wine);}
  .admin-panel{display:none;}
  .admin-panel.active{display:block;}
  .admin-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:20px;}
  .admin-card h4{margin:0 0 16px; font-size:17px;}
  .form-row{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  @media(max-width:600px){.form-row{grid-template-columns:1fr;}}
  .table-row{
    display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .table-row:last-child{border-bottom:none;}
  .table-thumb{width:52px; height:52px; border-radius:10px; overflow:hidden; background:var(--bg-alt); flex:none; display:flex; align-items:center; justify-content:center;}
  .table-thumb img{width:100%; height:100%; object-fit:cover;}
  .table-info{flex:1; min-width:0;}
  .table-info b{display:block; font-size:14.5px;}
  .table-info span{font-size:12.5px; color:var(--ink-soft);}
  .icon-btn{
    width:34px; height:34px; border-radius:999px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .icon-btn:hover{background:var(--bg-alt);}
  .icon-btn.danger:hover{background:#fbeaea; border-color:#e6b3b3;}
  .cat-pill{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:600; margin:0 8px 8px 0;}
  .cat-pill button{background:none; border:none; color:var(--wine); font-size:15px; line-height:1;}
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
    padding:13px 22px; border-radius:999px; font-size:13.5px; opacity:0; pointer-events:none; transition:all .3s ease; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- PETAL CLICK FX ---------- */
  .petal-fx{
    position:fixed; pointer-events:none; font-size:19px; z-index:300; left:0; top:0;
    transform:translate(-50%,-50%); animation:petalPop .85s ease-out forwards; will-change:transform, opacity;
  }
  @keyframes petalPop{
    0%{transform:translate(-50%,-50%) scale(0.3) rotate(0deg); opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot)); opacity:0;}
  }
  @media(prefers-reduced-motion:reduce){ .petal-fx{display:none;} }

  /* ---------- IMAGE UPLOAD ---------- */
  .upload-row{display:flex; align-items:center; gap:12px;}
  .upload-btn{
    padding:10px 16px; border-radius:10px; border:1px dashed var(--line); background:#fff; font-size:13px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .upload-btn:hover{border-color:var(--wine); color:var(--wine);}
  .upload-preview{width:44px; height:44px; border-radius:999px; overflow:hidden; background:var(--bg-alt); flex:none; display:none;}
  .upload-preview img{width:100%; height:100%; object-fit:cover;}
  .or-divider{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin:10px 0 6px;}
</style>
</head>
<body>

<div id="app"></div>
<div class="wa-float" id="waFloat" title="Chat on WhatsApp">

<script>
/* ========================= FIREBASE INIT ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyBhffykzeuydwtW5xyGcYSUXV6Smt5v8fY",
  authDomain: "ah-bouquets.firebaseapp.com",
  projectId: "ah-bouquets",
  storageBucket: "ah-bouquets.firebasestorage.app",
  messagingSenderId: "318415509667",
  appId: "1:318415509667:web:5f2cae70f19e9fc0754716"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* ========================= DATA LAYER ========================= */
const WA_NUMBER = "918892834930";
const ADMIN_EMAIL = "pnizam007@gmail.com";
const HERO_IMAGE_TRANSPARENT = "hero-bouquet.png";

const DEFAULT_CATEGORIES = [
  {id:"birthday", name:"Birthday"},
  {id:"anniversary", name:"Anniversary"},
  {id:"sympathy", name:"Sympathy"},
  {id:"keychains", name:"Keychains"}
];

const DEFAULT_PRODUCTS = [
  {id:"p1", name:"Sunrise Birthday Bunch", price:899, category:"birthday", image:"", desc:"Gerberas, spray roses and marigold tied with kraft wrap."},
  {id:"p2", name:"Golden Hour Roses", price:1199, category:"birthday", image:"", desc:"A dozen amber roses with eucalyptus."},
  {id:"p3", name:"Forever & Always", price:1499, category:"anniversary", image:"", desc:"Red roses, lisianthus and trailing greens."},
  {id:"p4", name:"Blush Promise", price:1299, category:"anniversary", image:"", desc:"Soft pink roses and ranunculus in blush wrap."},
  {id:"p5", name:"Gentle Condolences", price:999, category:"sympathy", image:"", desc:"White lilies and chrysanthemums, quietly arranged."},
  {id:"p6", name:"White Peace Bunch", price:899, category:"sympathy", image:"", desc:"Carnations and baby's breath in soft white."},
  {id:"p7", name:"Mini Rose Keychain", price:249, category:"keychains", image:"", desc:"A single preserved rose bud on a brass ring."},
  {id:"p8", name:"Daisy Charm Keychain", price:199, category:"keychains", image:"", desc:"A tiny daisy charm, dried and resin-sealed."}
];

let state = {
  categories: DEFAULT_CATEGORIES,
  products: DEFAULT_PRODUCTS,
  brand: {tagline:"Fresh bouquets, made to order, delivered same day — every stem picked and tied by hand."}
};

let activeFilter = "all";
let isAdminOpen = false;
let isLoginOpen = false;
let activeAdminTab = "products";
let editingProductId = null;
let pendingFile = null;

// Realtime listeners for Firestore
function initFirebaseListeners() {
  db.collection("categories").onSnapshot((snapshot) => {
    if (!snapshot.empty) {
      state.categories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    } else {
      DEFAULT_CATEGORIES.forEach(c => db.collection("categories").doc(c.id).set(c));
    }
  }, (err) => console.log("Category read fallback:", err));

  db.collection("products").onSnapshot((snapshot) => {
    if (!snapshot.empty) {
      state.products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    } else {
      DEFAULT_PRODUCTS.forEach(p => db.collection("products").doc(p.id).set(p));
    }
  }, (err) => console.log("Products read fallback:", err));

  auth.onAuthStateChanged((user) => {
    if (user && user.email === ADMIN_EMAIL) {
      isAdminOpen = true;
      isLoginOpen = false;
    } else {
      isAdminOpen = false;
    }
    render();
  });
}

/* ========================= HELPERS ========================= */
function catName(id){ const c = state.categories.find(c=>c.id===id); return c ? c.name : "Uncategorised"; }
function fmtPrice(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
function escapeHtml(s){ return String(s || "").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function waLink(message){
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`;
}
function orderMessage(product){
  return `Hi AH! I'd like to order:\n\n${product.name} — ${fmtPrice(product.price)}\n\nPlease let me know how to proceed.`;
}

  const s = size || 100;
  return `
  <svg width="${s}" height="${s}" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M60 118 L42 74 L78 74 Z" fill="${accent}" opacity="0.14"/>

    <line x1="60" y1="70" x2="44" y2="50" stroke="${accent}" stroke-width="2"/>
    <line x1="60" y1="70" x2="76" y2="52" stroke="${accent}" stroke-width="2"/>
    <ellipse cx="46" cy="44" rx="8" ry="5" fill="#7C8A63" transform="rotate(-30 46 44)"/>
    <ellipse cx="76" cy="48" rx="8" ry="5" fill="#7C8A63" transform="rotate(30 76 48)"/>
    <circle cx="60" cy="38" r="13" fill="${accent}"/>
    <circle cx="60" cy="38" r="7" fill="${accent}" opacity="0.55"/>
    <circle cx="40" cy="46" r="9" fill="#E7BAB4"/>
    <circle cx="40" cy="46" r="4.5" fill="#E7BAB4" opacity="0.6"/>

    <circle cx="80" cy="44" r="5" fill="#F3D9AE" opacity="0.6"/>
  </svg>`;
}
function keychainSVG(accent, size){
  const s = size || 100;
  return `
  <svg width="${s}" height="${s}" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="30" r="14" fill="none" stroke="${accent}" stroke-width="4"/>
    <line x1="60" y1="44" x2="60" y2="60" stroke="${accent}" stroke-width="3"/>
    <circle cx="60" cy="78" r="16" fill="${accent}" opacity="0.85"/>

  </svg>`;
}
function placeholderMedia(product){
  const accent = product.category === "sympathy" ? "#8C9B7E" : "#6B4FA0";
  const svg = product.category === "keychains" ? keychainSVG(accent, 96) : bouquetSVG(accent, 96);
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--bg-alt),var(--bg));">${svg}</div>`;
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

function render(){

    + `<div class="toast" id="toast"></div>`;

/* ========================= EVENTS ========================= */
function bindEvents(){
  document.getElementById("menuToggle")?.addEventListener("click", ()=>{
    document.getElementById("navLinks")?.classList.toggle("open");
  });
  document.querySelectorAll("#navLinks a").forEach(a=>{
    a.addEventListener("click", ()=> document.getElementById("navLinks")?.classList.remove("open"));
  });

  document.querySelectorAll("[data-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{ activeFilter = el.getAttribute("data-filter"); render(); document.getElementById("shop")?.scrollIntoView({behavior:"smooth"}); });
  });
  document.querySelectorAll("[data-filter-link]").forEach(el=>{
    el.addEventListener("click", (e)=>{ e.preventDefault(); activeFilter = el.getAttribute("data-filter-link"); render(); document.getElementById("shop")?.scrollIntoView({behavior:"smooth"}); });
  });

  document.getElementById("openAdminBtn")?.addEventListener("click", ()=>{
    if (auth.currentUser && auth.currentUser.email === ADMIN_EMAIL) {
      isAdminOpen = true;
      render();
    } else {
      isLoginOpen = true;
      render();
    }
  });

  document.getElementById("closeAdminBtn")?.addEventListener("click", ()=>{
    auth.signOut().then(() => {
      isAdminOpen = false;
      editingProductId = null;
      render();
    });
  });

  document.getElementById("cancelLoginBtn")?.addEventListener("click", ()=>{ isLoginOpen = false; render(); });
  document.getElementById("loginOverlay")?.addEventListener("click", (e)=>{ if(e.target.id === "loginOverlay"){ isLoginOpen = false; render(); }});
  
  document.getElementById("loginForm")?.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const pass = e.target.pass.value;
    try {
      await auth.signInWithEmailAndPassword(ADMIN_EMAIL, pass);
      isLoginOpen = false;
      isAdminOpen = true;
      render();
    } catch (err) {
      const errBox = document.getElementById("loginError");
      errBox.style.display = "block";
      errBox.textContent = err.message || "Invalid password";
    }
  });

  document.querySelectorAll(".admin-tab").forEach(el=>{
    el.addEventListener("click", ()=>{ activeAdminTab = el.getAttribute("data-tab"); editingProductId = null; render(); });
  });

  document.getElementById("imageFileInput")?.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    pendingFile = file;
    const reader = new FileReader();
    reader.onload = ()=>{
      const preview = document.getElementById("uploadPreview");
      const previewImg = document.getElementById("uploadPreviewImg");
      previewImg.src = reader.result;
      preview.style.display = "block";
      showToast("File attached. Click save to upload.");
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("productForm")?.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const saveBtn = document.getElementById("saveProductBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    const f = e.target;
    let imageUrl = f.image.value.trim();

    try {
      if (pendingFile) {
        showToast("Uploading photo...");
        const fileRef = storage.ref(`bouquets/${Date.now()}_${pendingFile.name}`);
        const snapshot = await fileRef.put(pendingFile);
        imageUrl = await snapshot.ref.getDownloadURL();
        pendingFile = null;
      }

      const productData = {
        name: f.name.value.trim(),
        price: Number(f.price.value),
        category: f.category.value,
        image: imageUrl,
        desc: f.desc.value.trim()
      };

      if(editingProductId){
        await db.collection("products").doc(editingProductId).update(productData);
        showToast("Bouquet updated!");
        editingProductId = null;
      } else {
        await db.collection("products").add(productData);
        showToast("Bouquet added!");
      }
      render();
    } catch (err) {
      showToast("Error saving: " + err.message);
      saveBtn.disabled = false;
      saveBtn.textContent = editingProductId ? "Save changes" : "Add bouquet";
    }
  });

  document.getElementById("cancelEditBtn")?.addEventListener("click", ()=>{ editingProductId = null; render(); });

  document.querySelectorAll("[data-edit-product]").forEach(el=>{
    el.addEventListener("click", ()=>{
      editingProductId = el.getAttribute("data-edit-product");
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  });

  document.querySelectorAll("[data-delete-product]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-delete-product");
      if(confirm("Are you sure you want to delete this bouquet?")) {
        await db.collection("products").doc(id).delete();
        showToast("Bouquet deleted");
      }
    });
  });

  document.getElementById("categoryForm")?.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const name = e.target.catName.value.trim();
    if(!name) return;
    const catId = name.toLowerCase().replace(/\s+/g, '-');
    await db.collection("categories").doc(catId).set({ id: catId, name });
    showToast("Category added!");
    render();
  });

  document.querySelectorAll("[data-delete-cat]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const id = el.getAttribute("data-delete-cat");
      const inUse = state.products.some(p=>p.category===id);
      if(inUse){ showToast("Move or delete its bouquets first"); return; }
      await db.collection("categories").doc(id).delete();
      showToast("Category removed");
    });
  });

  document.getElementById("waFloat").onclick = ()=>{ window.open(waLink("Hi AH! I'd like to place an order."), "_blank"); };
}

/* ========================= SCROLL REVEAL & EFFECTS ========================= */
function initReveal(){
  const els = document.querySelectorAll(".reveal:not(.in)");
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("in")); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{ if(entry.isIntersecting){ entry.target.classList.add("in"); io.unobserve(entry.target); }});
  }, {threshold:0.15});
  els.forEach(el=>io.observe(el));
}

function initTilt(){
  const isTouch = window.matchMedia("(hover: none)").matches;
  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(isTouch || prefersReduced) return;

  const heroArea = document.querySelector(".hero-inner");
  const illo = document.getElementById("heroIllustration");
  if(heroArea && illo){
    heroArea.addEventListener("mousemove", (e)=>{
      const r = heroArea.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) - 0.5;
      const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) - 0.5;
      illo.style.transform = `rotateY(${x*20}deg) rotateX(${-y*20}deg)`;
    });
    heroArea.addEventListener("mouseleave", ()=>{ illo.style.transform = "rotateY(0) rotateX(0)"; });
  }

  document.querySelectorAll(".card[data-tilt]").forEach(card=>{
    card.addEventListener("mousemove", (e)=>{
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `perspective(800px) rotateY(${x*8}deg) rotateX(${-y*8}deg) translateY(-4px)`;
    });
    card.addEventListener("mouseleave", ()=>{ card.style.transform = "perspective(800px) rotateY(0) rotateX(0) translateY(0)"; });
  });
}

function spawnPetals(x, y){
  const petals = ["🌸","🌷","💐","🌼","✿"];
  const count = 6;
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "petal-fx";
    el.textContent = petals[Math.floor(Math.random()*petals.length)];
    const angle = (Math.PI*2 * i/count) + (Math.random()*0.6 - 0.3);
    const dist = 46 + Math.random()*44;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 26;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--rot", (Math.random()*80 - 40) + "deg");
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
}

function initPetalFX(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.addEventListener("click", (e)=>{
    const target = e.target.closest(".btn, .order-btn, .chip, .wa-float");
    if(!target) return;
    spawnPetals(e.clientX, e.clientY);
  });
}

/* ========================= START APP ========================= */
initPetalFX();
initFirebaseListeners();
</script>
